server {
    listen 80;
    server_name _;

    # Docker bringt seinen internen DNS-Server unter 127.0.0.11 mit.
    # Mit "resolver" sagen wir nginx, diesen DNS für die Auflösung der
    # Service-Namen zu nutzen – sonst würde nginx den Hostnamen "backend"
    # nur einmal beim Start auflösen und cachen. Das macht den Stack
    # robust gegen Restarts und Container-Tausch (Bonus-Mission A).
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------------------
    # Statische Dateien (HTML/CSS/JS)
    # ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # ----------------------------------------------------------------
    # API-Anfragen → Backend-Service
    #
    # Der Hostname "backend" ist der Service-Name aus der compose.yaml.
    # Die Variable in proxy_pass zwingt nginx, den Namen pro Anfrage neu
    # aufzulösen (statt einmalig beim Start).
    # ----------------------------------------------------------------
    location /api/ {
        set $backend_upstream "backend:3000";
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        # Bei Backend-Ausfall sauber 502 statt langer Timeouts
        proxy_connect_timeout 2s;
    }

    # ----------------------------------------------------------------
    # Status-Pings für die Live-Lampen im Frontend
    #
    # Das Frontend pingt /__status/adminer alle paar Sekunden und färbt
    # die Lampe entsprechend. Bei Erfolg → 200, bei Ausfall → 502.
    # ----------------------------------------------------------------
    location = /__status/adminer {
        set $adminer_upstream "adminer:8080";
        proxy_pass http://$adminer_upstream/;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        # Wir interessieren uns nicht für den Body, nur für den Status
        proxy_intercept_errors off;
    }
}
