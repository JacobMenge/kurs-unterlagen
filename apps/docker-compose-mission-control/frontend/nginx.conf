server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Statische Dateien (HTML/CSS/JS)
    location / {
        try_files $uri $uri/ =404;
    }

    # Alle /api/-Anfragen werden an den Backend-Service weitergereicht.
    # Der Hostname "backend" ist der Service-Name aus der compose.yaml –
    # Docker Compose legt dafür automatisch einen DNS-Eintrag im
    # internen Netzwerk an.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
