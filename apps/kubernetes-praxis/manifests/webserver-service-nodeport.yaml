# Variante als NodePort: macht den Service von AUSSEN erreichbar,
# über einen Port am Cluster-Knoten. Praktisch mit minikube:
#   minikube service webserver --url
# Für die normale Übung reicht ClusterIP + kubectl port-forward.
apiVersion: v1
kind: Service
metadata:
  name: webserver
spec:
  type: NodePort
  selector:
    app: webserver
  ports:
    - port: 80
      targetPort: 80
      # nodePort: 30080   # optional fest; sonst vergibt Kubernetes 30000–32767
