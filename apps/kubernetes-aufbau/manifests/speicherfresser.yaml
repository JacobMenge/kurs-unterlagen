# Ein Pod, der absichtlich mehr Speicher greift, als sein Limit erlaubt.
# Das Image "polinux/stress" ist ein Last-Erzeuger: "stress --vm 1 --vm-bytes 150M"
# fordert 150 MB an - das Limit erlaubt aber nur 64 MB. Kubernetes killt den
# Container deshalb sofort: in "kubectl get pod" erscheint der Status OOMKilled
# (Out Of Memory Killed).
#
# restartPolicy: Never -> der Pod startet nicht endlos neu, der Status bleibt
# als OOMKilled stehen und ist in Ruhe zu sehen.
apiVersion: v1
kind: Pod
metadata:
  name: speicherfresser
  labels:
    app: speicherfresser
spec:
  restartPolicy: Never
  containers:
    - name: hog
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
      resources:
        requests:
          memory: "32Mi"
        limits:
          memory: "64Mi"          # harte Obergrenze - wird ueberschritten -> OOMKilled
