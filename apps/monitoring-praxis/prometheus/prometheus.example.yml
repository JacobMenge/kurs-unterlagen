# VORLAGE für eure prometheus.yml.
# Kopiert diese Datei nach "prometheus/prometheus.yml" und ergänzt dort
# Mission für Mission weitere scrape-Jobs (station-api, cadvisor, ...).
#
# "scrape_interval" legt fest, wie oft Prometheus seine Ziele abfragt.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Prometheus überwacht sich zuerst selbst.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
