# Monitoring-Stack mit Beispiel-App (Aurora Station) - fertig zum Starten.
# Läuft ohne weitere Vorbereitung:  docker compose up -d --build
# Die Ports lassen sich optional über eine .env überschreiben (.env.example).
services:

  station-api:
    build: ./station-api
    environment:
      PORT: 8000
    ports:
      - "${STATION_PORT:-8090}:8000"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
